name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean HorizonXI_Summoner_Unlock_Tracker.spec

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v3
        with:
          files: dist/HorizonXI_Summoner_Unlock_Tracker.exe
          generate_release_notes: true